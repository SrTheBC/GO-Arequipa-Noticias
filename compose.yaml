services:
  panel:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    restart: unless-stopped
  buscador:
    build: .
    env_file: .env
    command: python worker.py
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    restart: unless-stopped
